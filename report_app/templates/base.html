<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Топливный отчёт{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    
    <style>
        /* Общие стили для всех страниц */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .pagination a, .pagination span {
            display: inline-block;
            padding: 8px 14px;
            text-decoration: none;
            background-color: #f1f1f1;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ddd;
            transition: 0.2s;
        }
        .pagination a:hover {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .pagination .current {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
            font-weight: bold;
        }
        .pagination .disabled {
            background-color: #e9ecef;
            color: #6c757d;
            border-color: #dee2e6;
            cursor: not-allowed;
        }
        .pagination .dots {
            background: none;
            border: none;
            color: #333;
        }
        /* Индикатор загрузки (оверлей) */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #007bff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-align: center;
            width: 100%;
            text-decoration: none;
            color: #007bff;
        }
        .error {
            color: red;
            text-align: center;
        }
    </style>
    
    {% block extra_styles %}{% endblock %}
    
    <script>
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
    </script>
</head>
<body>

    <!-- Оверлей со спиннером (общий для всех страниц) -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-text">
            <div class="spinner"></div>
            <p>Загрузка данных...</p>
        </div>
    </div>

    <!-- Основной контент (заполняется в дочерних шаблонах) -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
